# Whole free stack: agent + Ollama (local LLM) + n8n (workflows) + Cloudflare quick tunnel (public URL for Twilio)
services:
  agent:
    build: .
    env_file: .env
    environment:
      LLM_BASE_URL: http://ollama:11434/v1
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/voice-agent-call
    volumes: ["./data:/app/data", "./config:/app/config"]
    ports: ["8000:8000"]
    depends_on: [ollama]
  ollama:
    image: ollama/ollama
    volumes: ["ollama:/root/.ollama"]
    # first run: docker compose exec ollama ollama pull llama3.2
  n8n:
    image: n8nio/n8n
    ports: ["5678:5678"]
    volumes: ["n8n:/home/node/.n8n"]
  tunnel:
    image: cloudflare/cloudflared
    command: tunnel --no-autoupdate --url http://agent:8000
    depends_on: [agent]
volumes: {ollama: {}, n8n: {}}
